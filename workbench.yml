# workbench.yml — workbench-cloud
#
# Ecosystem module (workbench-core ARCHITECTURE.md §2/§3): AWS/Azure/GCP CLI
# aliases and installers. Meaningless standalone — depends on
# workbench-core's loader and Core API (elevation, installers-common.sh,
# platform facts).
#
# See contracts/manifest-spec.md (in workbench-core) for the full field
# reference.
version: 2
branch: main

core_api: ">=1.10 <2.0"
sync:
  enabled: true

info:
  description: "AWS/Azure/GCP CLI aliases and installers, and the AWS Emulator"

register:
  shell:
    - src: shell/gcloud.sh
      tier: env
    - src: shell/aws.sh
      tier: tools
    - src: shell/aws-emulator.sh
      tier: tools
    - src: shell/azure.sh
      tier: tools
  installers:
    - src: shell/installers.sh
    - src: shell/installers-aws-emulator.sh
  getters:
    - name: cloud
      function: get-cloud-functions
      label: "AWS/Azure/GCP CLI and AWS Emulator helpers"
